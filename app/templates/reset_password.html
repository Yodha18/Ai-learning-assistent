{% extends "base.html" %}

{% block title %}Reset Password - Lumina Academic{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full space-y-6 bg-white p-8 rounded-xl border border-outline-variant">
        <div class="text-center">
            <h1 class="font-display text-2xl font-bold text-on-surface">Choose a new password</h1>
        </div>
        <form action="/api/auth/reset-password" method="POST" class="space-y-4">
            <input type="hidden" name="token" value="{{ token }}">
            <label for="password" class="block text-sm font-medium text-on-surface">New password</label>
            <input id="password" name="password" type="password" minlength="8" required
                   class="w-full px-4 py-3 rounded-lg border border-outline-variant"
                   placeholder="At least 8 characters">
            <button type="submit" class="w-full bg-primary text-on-primary py-3 rounded-lg">
                Update password
            </button>
        </form>
    </div>
</div>
{% endblock %}
