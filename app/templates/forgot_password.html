{% extends "base.html" %}

{% block title %}Forgot Password - Lumina Academic{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full space-y-6 bg-white p-8 rounded-xl border border-outline-variant">
        <div class="text-center">
            <h1 class="font-display text-2xl font-bold text-on-surface">Reset your password</h1>
            <p class="mt-2 text-sm text-on-surface-variant">Enter your email address. If it is registered, we will send a reset link.</p>
        </div>
        <form action="/api/auth/forgot-password" method="POST" class="space-y-4">
            <label for="email" class="block text-sm font-medium text-on-surface">Email address</label>
            <input id="email" name="email" type="email" required
                   class="w-full px-4 py-3 rounded-lg border border-outline-variant"
                   placeholder="you@gmail.com">
            <button type="submit" class="w-full bg-primary text-on-primary py-3 rounded-lg">
                Send reset link
            </button>
        </form>
        <div class="text-center">
            <a href="/login" class="text-sm text-primary hover:underline">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
