{% extends "base.html" %}

{% block title %}Quiz - Lumina Academic{% endblock %}

{% block content %}
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm">
    <div class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto h-[64px]">
        <a href="/dashboard" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant/50 transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1 class="font-display text-xl font-bold text-primary">Quiz</h1>
        <div class="w-10"></div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 pt-24 pb-16">
    <!-- Quiz Setup -->
    <div id="quiz-setup" class="bg-white rounded-xl shadow-sm border border-surface-variant p-6">
        <h2 class="font-display text-xl font-semibold text-on-surface mb-6">Generate Quiz</h2>
        
        <form id="quiz-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Subject</label>
                <select id="subject-select" class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary">
                    <option value="">Select Subject</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Topic (Optional)</label>
                <select id="topic-select" class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary">
                    <option value="">All Topics</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Difficulty</label>
                <div class="grid grid-cols-3 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="difficulty" value="easy" class="peer sr-only">
                        <div class="p-3 border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-primary-container/10 peer-checked:text-primary transition-all text-center">
                            <span class="font-medium">Easy</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="difficulty" value="medium" class="peer sr-only" checked>
                        <div class="p-3 border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-primary-container/10 peer-checked:text-primary transition-all text-center">
                            <span class="font-medium">Medium</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="difficulty" value="hard" class="peer sr-only">
                        <div class="p-3 border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-primary-container/10 peer-checked:text-primary transition-all text-center">
                            <span class="font-medium">Hard</span>
                        </div>
                    </label>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-on-surface mb-1">Number of Questions</label>
                <input type="number" id="question-count" min="1" max="20" value="5" class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary">
            </div>
            
            <button type="submit" class="w-full bg-primary text-on-primary py-3 rounded-lg hover:bg-primary-container transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">auto_awesome</span>
                Generate Quiz
            </button>
        </form>
    </div>

    <!-- Quiz Taking -->
    <div id="quiz-taking" class="hidden">
        <div class="bg-white rounded-xl shadow-sm border border-surface-variant overflow-hidden">
            <div class="p-4 border-b border-surface-variant flex items-center justify-between">
                <div>
                    <h2 class="font-display text-lg font-semibold text-on-surface" id="quiz-title">Quiz</h2>
                    <p class="text-sm text-on-surface-variant" id="quiz-progress">Question 1 of 5</p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-on-surface-variant">Time:</span>
                    <span id="quiz-timer" class="font-mono text-lg font-medium text-primary">00:00</span>
                </div>
            </div>
            
            <div id="question-container" class="p-6">
                <!-- Question will be loaded here -->
            </div>
            
            <div class="p-4 border-t border-surface-variant flex justify-between">
                <button id="prev-btn" onclick="previousQuestion()" class="px-4 py-2 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors disabled:opacity-50" disabled>
                    Previous
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-4 py-2 bg-primary text-on-primary rounded-lg hover:bg-primary-container transition-colors">
                    Next
                </button>
                <button id="submit-btn" onclick="submitQuiz()" class="px-4 py-2 bg-secondary text-on-secondary rounded-lg hover:bg-secondary-container transition-colors hidden">
                    Submit Quiz
                </button>
            </div>
        </div>
    </div>

    <!-- Quiz Results -->
    <div id="quiz-results" class="hidden">
        <div class="bg-white rounded-xl shadow-sm border border-surface-variant p-6 text-center">
            <div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center text-primary mx-auto mb-4">
                <span class="material-symbols-outlined text-[40px]">emoji_events</span>
            </div>
            <h2 class="font-display text-2xl font-bold text-on-surface mb-2">Quiz Complete!</h2>
            <div class="text-5xl font-bold text-primary mb-2" id="final-score">0%</div>
            <p class="text-on-surface-variant mb-6" id="score-message">Great effort!</p>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-surface-container-low rounded-lg p-4">
                    <div class="text-2xl font-bold text-on-surface" id="correct-count">0</div>
                    <div class="text-sm text-on-surface-variant">Correct</div>
                </div>
                <div class="bg-surface-container-low rounded-lg p-4">
                    <div class="text-2xl font-bold text-on-surface" id="incorrect-count">0</div>
                    <div class="text-sm text-on-surface-variant">Incorrect</div>
                </div>
            </div>
            
            <div class="flex gap-3 justify-center">
                <button onclick="showQuizSetup()" class="px-6 py-3 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors">
                    New Quiz
                </button>
                <button onclick="reviewAnswers()" class="px-6 py-3 bg-primary text-on-primary rounded-lg hover:bg-primary-container transition-colors">
                    Review Answers
                </button>
            </div>
        </div>
    </div>
</main>

<script>
let currentQuiz = null;
let currentQuestionIndex = 0;
let userAnswers = {};
let quizStartTime = null;
let timerInterval = null;

async function loadSubjects() {
    try {
        const response = await fetch('/api/subjects');
        const subjects = await response.json();
        
        const select = document.getElementById('subject-select');
        select.innerHTML = '<option value="">Select Subject</option>' + 
            subjects.map(sub => `<option value="${sub.id}">${sub.name}</option>`).join('');
    } catch (error) {
        console.error('Error loading subjects:', error);
    }
}

document.getElementById('subject-select').addEventListener('change', async function() {
    const subjectId = this.value;
    const topicSelect = document.getElementById('topic-select');
    
    if (!subjectId) {
        topicSelect.innerHTML = '<option value="">All Topics</option>';
        return;
    }
    
    try {
        const response = await fetch(`/api/subjects/${subjectId}/topics`);
        const topics = await response.json();
        
        topicSelect.innerHTML = '<option value="">All Topics</option>' + 
            topics.map(topic => `<option value="${topic.id}">${topic.name}</option>`).join('');
    } catch (error) {
        console.error('Error loading topics:', error);
    }
});

document.getElementById('quiz-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const subjectId = document.getElementById('subject-select').value;
    const topicId = document.getElementById('topic-select').value;
    const difficulty = document.querySelector('input[name="difficulty"]:checked').value;
    const questionCount = document.getElementById('question-count').value;
    
    try {
        const response = await fetch('/api/quizzes/generate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                subject_id: subjectId ? parseInt(subjectId) : null,
                topic_id: topicId ? parseInt(topicId) : null,
                difficulty: difficulty,
                number_of_questions: parseInt(questionCount)
            })
        });
        
        if (response.ok) {
            currentQuiz = await response.json();
            startQuiz();
        } else {
            const error = await response.json();
            alert(error.detail || 'Failed to generate quiz');
        }
    } catch (error) {
        console.error('Error generating quiz:', error);
        alert('Failed to generate quiz. Please try again.');
    }
});

function startQuiz() {
    currentQuestionIndex = 0;
    userAnswers = {};
    quizStartTime = Date.now();
    
    document.getElementById('quiz-setup').classList.add('hidden');
    document.getElementById('quiz-taking').classList.remove('hidden');
    document.getElementById('quiz-results').classList.add('hidden');
    
    document.getElementById('quiz-title').textContent = currentQuiz.title;
    
    startTimer();
    displayQuestion();
}

function displayQuestion() {
    const question = currentQuiz.questions[currentQuestionIndex];
    const container = document.getElementById('question-container');
    
    document.getElementById('quiz-progress').textContent = 
        `Question ${currentQuestionIndex + 1} of ${currentQuiz.questions.length}`;
    
    const selectedAnswer = userAnswers[question.id];
    
    container.innerHTML = `
        <div class="mb-6">
            <h3 class="text-lg font-medium text-on-surface mb-4">${question.question_text}</h3>
            <div class="space-y-3">
                ${question.options.map((option, index) => `
                    <label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors ${selectedAnswer === index ? 'border-primary bg-primary-container/10' : ''}">
                        <input type="radio" name="answer" value="${index}" ${selectedAnswer === index ? 'checked' : ''} class="mr-3" onchange="selectAnswer(${question.id}, ${index})">
                        <span>${option}</span>
                    </label>
                `).join('')}
            </div>
        </div>
    `;
    
    // Update navigation buttons
    document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
    
    if (currentQuestionIndex === currentQuiz.questions.length - 1) {
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
    } else {
        document.getElementById('next-btn').classList.remove('hidden');
        document.getElementById('submit-btn').classList.add('hidden');
    }
}

function selectAnswer(questionId, answerIndex) {
    userAnswers[questionId] = answerIndex;
    displayQuestion(); // Re-render to show selection
}

function nextQuestion() {
    if (currentQuestionIndex < currentQuiz.questions.length - 1) {
        currentQuestionIndex++;
        displayQuestion();
    }
}

function previousQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        displayQuestion();
    }
}

async function submitQuiz() {
    const timeTaken = Math.floor((Date.now() - quizStartTime) / 1000);
    stopTimer();
    
    const answers = Object.keys(userAnswers).map(questionId => ({
        question_id: parseInt(questionId),
        selected_answer: userAnswers[questionId]
    }));
    
    try {
        const response = await fetch(`/api/quizzes/${currentQuiz.id}/submit`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                quiz_id: currentQuiz.id,
                answers: answers,
                time_taken: timeTaken
            })
        });
        
        if (response.ok) {
            const result = await response.json();
            showResults(result);
        } else {
            const error = await response.json();
            alert(error.detail || 'Failed to submit quiz');
        }
    } catch (error) {
        console.error('Error submitting quiz:', error);
        alert('Failed to submit quiz. Please try again.');
    }
}

function showResults(result) {
    document.getElementById('quiz-taking').classList.add('hidden');
    document.getElementById('quiz-results').classList.remove('hidden');
    
    document.getElementById('final-score').textContent = `${Math.round(result.score)}%`;
    
    const correctCount = result.answers.filter(a => a.is_correct).length;
    const incorrectCount = result.answers.length - correctCount;
    
    document.getElementById('correct-count').textContent = correctCount;
    document.getElementById('incorrect-count').textContent = incorrectCount;
    
    let message = '';
    if (result.score >= 80) message = 'Excellent work!';
    else if (result.score >= 60) message = 'Good job!';
    else if (result.score >= 40) message = 'Keep practicing!';
    else message = 'Don\'t give up!';
    
    document.getElementById('score-message').textContent = message;
}

function showQuizSetup() {
    document.getElementById('quiz-setup').classList.remove('hidden');
    document.getElementById('quiz-taking').classList.add('hidden');
    document.getElementById('quiz-results').classList.add('hidden');
    
    currentQuiz = null;
    currentQuestionIndex = 0;
    userAnswers = {};
}

function reviewAnswers() {
    // Implement answer review functionality
    alert('Answer review feature coming soon!');
}

function startTimer() {
    timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - quizStartTime) / 1000);
        const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const seconds = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('quiz-timer').textContent = `${minutes}:${seconds}`;
    }, 1000);
}

function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

// Load subjects on page load
loadSubjects();
</script>
{% endblock %}
