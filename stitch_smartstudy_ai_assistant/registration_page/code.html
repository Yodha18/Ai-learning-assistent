<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Academic Intelligence - Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Outfit:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "tertiary-container": "#885500",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-container": "#e5eeff",
                        "on-primary-fixed-variant": "#3323cc",
                        "tertiary": "#684000",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-secondary-fixed": "#002113",
                        "secondary": "#006c49",
                        "primary-container": "#4f46e5",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-variant": "#d3e4fe",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container-high": "#dce9ff",
                        "primary": "#3525cd",
                        "on-background": "#0b1c30",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "surface-dim": "#cbdbf5",
                        "inverse-primary": "#c3c0ff",
                        "on-surface-variant": "#464555",
                        "surface-container-highest": "#d3e4fe",
                        "on-primary-container": "#dad7ff",
                        "background": "#f8f9ff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#0f0069",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#ffd4a4",
                        "surface-container-low": "#eff4ff",
                        "secondary-fixed-dim": "#4edea3",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-bright": "#f8f9ff",
                        "outline": "#777587",
                        "on-surface": "#0b1c30",
                        "on-tertiary-fixed-variant": "#653e00",
                        "primary-fixed": "#e2dfff",
                        "on-secondary-container": "#00714d",
                        "on-primary": "#ffffff",
                        "secondary-container": "#6cf8bb",
                        "outline-variant": "#c7c4d8",
                        "secondary-fixed": "#6ffbbe",
                        "surface": "#f8f9ff",
                        "surface-tint": "#4d44e3",
                        "inverse-surface": "#213145"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "xl": "64px",
                        "container-max": "1280px",
                        "sm": "12px",
                        "xs": "4px",
                        "gutter": "24px",
                        "base": "8px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "display": ["Outfit"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Outfit"],
                        "source-cite": ["Inter"]
                    },
                    "fontSize": {
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "source-cite": ["13px", { "lineHeight": "18px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .squircle {
            border-radius: 12px;
        }
        /* Gradient for progress/accents */
        .gradient-accent {
            background: linear-gradient(135deg, #3525cd 0%, #006c49 100%);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen font-body-md antialiased overflow-x-hidden">
<!-- Top App Bar (Simplified for transactional screen) -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-md px-md py-sm flex items-center justify-center border-b border-surface-variant/50">
<h1 class="font-display font-bold text-headline-md text-primary tracking-tight">Academic Intelligence</h1>
</header>
<!-- Main Content Area -->
<main class="pt-24 pb-xl px-4 md:px-8 max-w-[600px] mx-auto w-full">
<div class="mb-8 text-center">
<h2 class="font-headline-lg-mobile text-on-surface mb-2">Create Your Profile</h2>
<p class="text-on-surface-variant font-body-sm">Join the intelligent academic platform designed for focus.</p>
</div>
<form class="space-y-6 bg-surface-container-lowest p-6 rounded-xl shadow-[0px_12px_32px_rgba(0,0,0,0.03)] border border-surface-variant/30 relative overflow-hidden">
<!-- Decorative gradient accent line at top of form -->
<div class="absolute top-0 left-0 w-full h-1 gradient-accent"></div>
<!-- Personal Info Section -->
<fieldset class="space-y-4">
<legend class="sr-only">Personal Information</legend>
<div>
<label class="block font-label-md text-on-surface-variant mb-1" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-low border-none border-b-2 border-b-transparent focus:border-b-primary focus:ring-0 rounded-t-lg transition-colors font-body-md text-on-surface placeholder:text-outline-variant" id="fullName" name="fullName" placeholder="Alex Scholar" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-md text-on-surface-variant mb-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-low border-none border-b-2 border-b-transparent focus:border-b-primary focus:ring-0 rounded-t-lg transition-colors font-body-md text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="alex@university.edu" required="" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
<div>
<label class="block font-label-md text-on-surface-variant mb-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-low border-none border-b-2 border-b-transparent focus:border-b-primary focus:ring-0 rounded-t-lg transition-colors font-body-md text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div>
<label class="block font-label-md text-on-surface-variant mb-1" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock_reset</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-low border-none border-b-2 border-b-transparent focus:border-b-primary focus:ring-0 rounded-t-lg transition-colors font-body-md text-on-surface placeholder:text-outline-variant" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
</fieldset>
<hr class="border-surface-variant/50"/>
<!-- Academic Info Section -->
<fieldset class="space-y-4">
<legend class="font-headline-md text-on-surface text-lg mb-4">Academic Details</legend>
<div>
<label class="block font-label-md text-on-surface-variant mb-1" for="course">Course</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">school</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-low border-none border-b-2 border-b-transparent focus:border-b-primary focus:ring-0 rounded-t-lg transition-colors font-body-md text-on-surface placeholder:text-outline-variant" id="course" name="course" readonly="" type="text" value="B.Tech CSE"/>
</div>
</div>
<div>
<label class="block font-label-md text-on-surface-variant mb-1" for="semester">Semester</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">calendar_month</span>
<select class="w-full pl-10 pr-10 py-3 bg-surface-container-low border-none border-b-2 border-b-transparent focus:border-b-primary focus:ring-0 rounded-t-lg transition-colors font-body-md text-on-surface appearance-none" id="semester" name="semester">
<option disabled="" selected="" value="">Select Semester</option>
<option value="1">Semester 1</option>
<option value="2">Semester 2</option>
<option value="3">Semester 3</option>
<option value="4">Semester 4</option>
<option value="5">Semester 5</option>
<option value="6">Semester 6</option>
<option value="7">Semester 7</option>
<option value="8">Semester 8</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
</fieldset>
<hr class="border-surface-variant/50"/>
<!-- Learning Goals Section -->
<fieldset class="space-y-4">
<legend class="font-headline-md text-on-surface text-lg mb-4">Learning Profile</legend>
<div>
<label class="block font-label-md text-on-surface-variant mb-3">Primary Learning Goal</label>
<div class="grid grid-cols-2 gap-2">
<!-- Custom Radio Buttons (Bento-ish grid for goals) -->
<label class="cursor-pointer">
<input class="peer sr-only" name="learningGoal" type="radio" value="exams"/>
<div class="p-3 border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-primary-container/10 peer-checked:text-primary transition-all text-center">
<span class="material-symbols-outlined mb-1 block text-[20px]">menu_book</span>
<span class="font-body-sm font-medium block">Semester Exams</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="learningGoal" type="radio" value="cp"/>
<div class="p-3 border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-primary-container/10 peer-checked:text-primary transition-all text-center">
<span class="material-symbols-outlined mb-1 block text-[20px]">code</span>
<span class="font-body-sm font-medium block">Competitive Prog.</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="learningGoal" type="radio" value="placements"/>
<div class="p-3 border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-primary-container/10 peer-checked:text-primary transition-all text-center">
<span class="material-symbols-outlined mb-1 block text-[20px]">work</span>
<span class="font-body-sm font-medium block">Placements</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="learningGoal" type="radio" value="interview"/>
<div class="p-3 border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-primary-container/10 peer-checked:text-primary transition-all text-center">
<span class="material-symbols-outlined mb-1 block text-[20px]">forum</span>
<span class="font-body-sm font-medium block">Interview Prep</span>
</div>
</label>
<label class="cursor-pointer col-span-2">
<input checked="" class="peer sr-only" name="learningGoal" type="radio" value="general"/>
<div class="p-3 border border-outline-variant rounded-lg peer-checked:border-primary peer-checked:bg-primary-container/10 peer-checked:text-primary transition-all text-center flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">lightbulb</span>
<span class="font-body-sm font-medium">General Learning</span>
</div>
</label>
</div>
</div>
<div class="pt-4">
<div class="flex justify-between items-center mb-2">
<label class="font-label-md text-on-surface-variant" for="studyTime">Daily Study Time Commitment</label>
<span class="font-body-sm font-medium text-primary" id="studyTimeDisplay">2 Hours</span>
</div>
<input class="w-full h-2 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" id="studyTime" max="6" min="0.5" name="studyTime" oninput="document.getElementById('studyTimeDisplay').innerText = this.value + (this.value == 1 ? ' Hour' : ' Hours')" step="0.5" type="range" value="2"/>
<div class="flex justify-between mt-1 text-[10px] text-outline px-1">
<span>30m</span>
<span>6h+</span>
</div>
</div>
</fieldset>
<div class="pt-6">
<button class="w-full bg-primary text-on-primary font-label-md text-[14px] py-4 rounded-xl shadow-sm hover:shadow-md hover:bg-primary/90 transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                    Create My Learning Profile
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<p class="text-center font-body-sm text-on-surface-variant mt-4">
                Already have an account? <a class="text-primary font-medium hover:underline" href="#">Log in</a>
</p>
</form>
</main>
</body></html>
