<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; }
        
        .bg-pattern {
            background-image: radial-gradient(var(--tw-colors-surface-container-high) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden bg-pattern">
<!-- Decorative Blur Orbs -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-fixed-dim/30 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-fixed-dim/20 rounded-full blur-[80px] pointer-events-none"></div>
<main class="w-full max-w-md mx-auto p-md relative z-10">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_12px_32px_rgba(0,0,0,0.08)] p-lg flex flex-col gap-md relative overflow-hidden border border-outline-variant/30">
<!-- Header -->
<div class="text-center flex flex-col items-center gap-sm">
<!-- Brand Icon -->
<div class="w-16 h-16 bg-surface-container rounded-xl flex items-center justify-center mb-2 shadow-sm text-primary">
<span class="material-symbols-outlined text-[32px] font-variation-settings-'FILL'-1">school</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to continue your academic journey.</p>
</div>
<!-- Illustration Placeholder -->
<div class="w-full h-32 bg-surface-container-low rounded-lg relative overflow-hidden flex items-center justify-center my-2 border border-outline-variant/20">
<img class="w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="A clean, minimalist 3D illustration representing artificial intelligence in education. Features a stylized glowing brain seamlessly connected to an open book via sleek, glowing pathways. The color palette utilizes soft whites, deep indigo (primary), and emerald green (secondary) accents. High-key lighting, soft shadows, pristine light mode aesthetic. Professional and scholarly mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3WzmgWf_eL0_Rm6V6m5DTj_KIZscpdxFOOnRCn3b8MN3HnbsN6GmJsQhW3yGehVCr6OvZ2O4H2e_NIWad8zeNJtUtrZKaxoVgigZ5dph7magrwfH4A5JYW_tG9qxd_thL1jfEyAl49FBZUEUDJuJq7Ht-uovXJXtdSKyp0MpcFzrkdhaELQDnQDp8iwzm8feR49JL8hJMpX8o87Rllt3LAPW5kWZFEWH91qOY5ZKl3QkaS6qvQLQ4eA"/>
</div>
<!-- Form -->
<form class="flex flex-col gap-sm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface pl-10 pr-4 py-3 rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline/70" id="email" placeholder="student@university.edu" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface pl-10 pr-10 py-3 rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<button class="mt-2 w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-3 rounded-lg transition-colors shadow-sm flex justify-center items-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink-0 mx-4 text-outline font-label-md text-label-md">OR</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-surface hover:bg-surface-container-high text-on-surface border border-outline-variant font-label-md text-label-md py-3 rounded-lg transition-colors flex justify-center items-center gap-3" type="button">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJmK-m_R39CUdQpVca_EIWmcnIiCZl_iTO2dnl5D6-CYEnp6hvDxKKo1WhnyyzO-UGzLkIARqlrW1CeNtwLzkSbPJh4g4XtWwHPbYMYqbMezxIY7TryIuntyhEbzHjaQ3w539z8vtGkJlTAXGOePZ25Q62EQFa0bGO6oZD-EUkJgOuEwJ-1F7-eRKVV0CAt123PeXMriOg8suqzVym605rQX42skND-M7JkPncp8ncgZV0479vKaShhQ"/>
                Continue with Google
            </button>
<div class="text-center mt-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Create Account</a>
</p>
</div>
</div>
